{% set name = "pyct" %}
{% set version = "0.4.8" %}
{% set sha256 = "23d7525b5a1567535c093aea4b9c33809415aa5f018dd77f6eb738b1226df6f7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  entry_points:
    - pyct=pyct.__main__:main

requirements:
  host:
    - param >=1.7.0
    - python
    - pip
    - setuptools >=30.3.0
    - wheel
  run:
    - param >=1.7.0
    - python
    # extras_require for 'cmd':
    - pyyaml
    - requests

test:
  imports:
    - pyct
    - pyct.build
    - pyct.cmd
  requires:
    - pip
  commands:
    - pip check || true    # [not win]
    - pip check || exit 0  # [win]
    - pyct --help

about:
  home: https://github.com/pyviz/pyct
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: python package common tasks for users (e.g. copy examples, fetch data, ...)
  dev_url: https://github.com/pyviz/pyct
  doc_url: https://github.com/pyviz-dev/pyct/blob/master/README.md

extra:
  recipe-maintainers:
    - ceball
